# pnpm settings for the backend project (pnpm 12 reads config here, not .npmrc).
# publicHoistPattern hoists the @types packages into the root node_modules so that
# the "declare module 'express-serve-static-core'" augmentation in src/auth.ts
# resolves the same way it did under npm's flat node_modules layout.
publicHoistPattern:
  - "*types*"

allowBuilds:
  esbuild: true
