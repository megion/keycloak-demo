<section class="login-page">
  <div class="login-card">
    <h1>Sign in to MyApp</h1>
    <form [formRoot]="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        [formField]="loginForm.email"
        autocomplete="email"
      />
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        [formField]="loginForm.password"
        autocomplete="current-password"
      />
      @if (loginError()) {
        <p class="form-error" role="alert">{{ loginError() }}</p>
      }
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">
      MyApp uses Keycloak as its identity provider. After you press "Sign in",
      Keycloak verifies your credentials and returns you to the user information
      page.
    </p>
  </div>
</section>
